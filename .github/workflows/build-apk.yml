name: Build C Acoustic from uploaded ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '*.zip'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find C Acoustic source ZIP
        id: srczip
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          ZIP_FILE=""

          # Prefer the newest named project package; otherwise accept any c-acoustic*.zip.
          for candidate in \
            "$ROOT/c-acoustic-transfer-function-v0.4.0.zip" \
            "$ROOT/c-acoustic-next-build-v0.3.0.zip" \
            "$ROOT/c-acoustic-live-rta-source.zip"; do
            if [ -f "$candidate" ]; then ZIP_FILE="$candidate"; break; fi
          done

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find "$ROOT" -maxdepth 1 -type f -iname 'c-acoustic*.zip' -print | head -n 1 || true)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Tidak ditemukan ZIP bernama c-acoustic*.zip di root repository. Unggah ZIP source C Acoustic ke halaman Code, bukan ke folder."
            echo "Isi root repository:"
            ls -la "$ROOT"
            exit 1
          fi

          echo "Menggunakan source ZIP: $(basename "$ZIP_FILE")"
          echo "file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract source ZIP on runner
        shell: bash
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/c-acoustic-src"
          mkdir -p "$DEST"
          unzip -q "${{ steps.srczip.outputs.file }}" -d "$DEST"

          if [ -f "$DEST/settings.gradle.kts" ]; then
            SRC_DIR="$DEST"
          else
            SETTINGS_FILE="$(find "$DEST" -mindepth 2 -maxdepth 5 -type f -name settings.gradle.kts -print -quit)"
            if [ -z "$SETTINGS_FILE" ]; then
              echo "::error::settings.gradle.kts tidak ditemukan dalam ZIP. Pastikan yang diunggah adalah ZIP source project."
              find "$DEST" -maxdepth 3 -type f | head -n 80
              exit 1
            fi
            SRC_DIR="$(dirname "$SETTINGS_FILE")"
          fi
          echo "SRC_DIR=$SRC_DIR" >> "$GITHUB_ENV"

      - name: Locate Android SDK and install packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "::error::Android SDK tidak tersedia pada runner."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager tidak ditemukan."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Generate Gradle Wrapper if missing
        shell: bash
        working-directory: ${{ env.SRC_DIR }}
        run: |
          set -euo pipefail
          if [ ! -f ./gradlew ]; then gradle wrapper --gradle-version 8.9; fi
          chmod +x ./gradlew

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.SRC_DIR }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: c-acoustic-debug-apk
          path: ${{ env.SRC_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
